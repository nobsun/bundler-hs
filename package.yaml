name:         bundler-hs
version:      0.1.0.0
github:       toyboot4e/bundler-hs
synopsis:
  Bundle a Haskell source file with its local library modules into one file.
description:
  Expands imports of local library modules in a single Haskell source file,
  recursively, renaming every top-level name with a module-derived suffix so
  the result compiles as one self-contained module (for competitive
  programming judges).

license:      MIT
author:       toyboot4e
maintainer:   toyboot4e@gmail.com

extra-source-files:
- README.md

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wredundant-constraints

dependencies:
- base                    >=4.18 && <5
- bytestring
- Cabal-syntax            >=3.12 && <3.17
- containers
- cpphs
- directory
- filepath
- ghc-lib-parser          >=9.12 && <9.13
- ghc-lib-parser-ex       >=9.12 && <9.13
- hindent                 >=6.3  && <6.4
- optparse-applicative
- syb
- text
- transformers
- typed-process
- uniplate

language: GHC2021

library:
  source-dirs:            src

executables:
  bundler-hs:
    main:                 Main.hs
    source-dirs:          app
    ghc-options:
    - -rtsopts
    dependencies:
    - bundler-hs

tests:
  bundler-hs-test:
    main:                 Main.hs
    source-dirs:          test
    dependencies:
    - bundler-hs
    - tasty
    - tasty-golden
    - tasty-hunit
